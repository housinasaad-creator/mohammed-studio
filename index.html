<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MOHAMMED · مواقع سريعة وجميلة لأنشطتك</title>
<meta name="description" content="نبني لنشاطك موقعاً جميلاً وسريعاً بتصميم خاص، يعمل بسلاسة على الجوال، وطلب الزبون يصلك على واتساب. تسليم خلال أيام.">
<meta name="theme-color" content="#12141c">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="MOHAMMED · مواقع سريعة وجميلة لأنشطتك">
<meta property="og:description" content="موقع جميل وسريع لنشاطك، وزبونك يصلك على واتساب.">
<meta property="og:image" content="https://housinasaad-creator.github.io/mohammed-studio/assets/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/shots/chocolate-d.webp" fetchpriority="high">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#main" id="skip"></a>

<header class="hdr" id="hdr">
  <div class="wrap hdr-in">
    <a class="logo" href="#top" aria-label="MOHAMMED">
      <img class="logo-mark" src="assets/logo-mark.png" width="217" height="128" alt="">
      <span class="logo-t"><b>MOHAMMED</b><small>Web Studio</small></span>
    </a>
    <nav class="nav" id="nav" aria-label="main"></nav>
    <div class="hdr-r">
      <button class="lang" id="lang" type="button"></button>
      <a class="btn btn-sm hdr-cta" href="#contact" id="hdrCta"></a>
    </div>
  </div>
  <i class="prog" id="prog" aria-hidden="true"></i>
</header>

<main id="main">
  <section class="hero" id="top">
    <div class="bg-fx" id="fx" aria-hidden="true">
      <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
      <svg class="shp s1" viewBox="0 0 80 80"><circle cx="40" cy="40" r="32" fill="none" stroke="#ff6a3d" stroke-width="6"/></svg>
      <svg class="shp s2" viewBox="0 0 80 80"><rect x="10" y="10" width="60" height="60" rx="12" fill="none" stroke="#12141c" stroke-width="5"/></svg>
      <svg class="shp s3" viewBox="0 0 80 80"><path d="M40 10v60M10 40h60" stroke="#ff6a3d" stroke-width="10" stroke-linecap="round"/></svg>
      <svg class="shp s4" viewBox="0 0 120 40"><path d="M6 28l18-16 18 16 18-16 18 16 18-16 18 16" fill="none" stroke="#12141c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="shp s5" viewBox="0 0 80 80"><path d="M40 10L72 66H8z" fill="none" stroke="#12141c" stroke-width="5" stroke-linejoin="round"/></svg>
      <svg class="shp s6" viewBox="0 0 60 60"><g fill="#ff6a3d"><circle cx="8" cy="8" r="4"/><circle cx="30" cy="8" r="4"/><circle cx="52" cy="8" r="4"/><circle cx="8" cy="30" r="4"/><circle cx="30" cy="30" r="4"/><circle cx="52" cy="30" r="4"/><circle cx="8" cy="52" r="4"/><circle cx="30" cy="52" r="4"/><circle cx="52" cy="52" r="4"/></g></svg>
    </div>
    <div class="wrap hero-in">
      <div class="hero-copy">
        <p class="badge" id="hBadge"></p>
        <h1><span id="h1a"></span> <em id="h1b"></em></h1>
        <p class="hero-sub" id="hSub"></p>
        <div class="hero-cta"><a class="btn btn-lg" href="#contact" id="hCta"></a><a class="btn btn-line btn-lg" href="#works" id="hCta2"></a></div>
        <ul class="facts" id="hFacts"></ul>
      </div>
      <div class="hero-vis" id="vis" aria-hidden="true"><div class="vis-in">
        <div class="dev dev-desk"><i class="dots"><b></b><b></b><b></b></i><img src="assets/shots/chocolate-d.webp" width="960" height="600" alt="" fetchpriority="high"></div>
        <div class="dev dev-ph p1"><img src="assets/shots/mozaik-m.webp" width="330" height="715" alt="" loading="lazy"></div>
        <div class="dev dev-ph p2"><img src="assets/shots/khayt-m.webp" width="330" height="715" alt="" loading="lazy"></div>
        <div class="chat" id="chat"></div>
      </div></div>
    </div>
  </section>

  <div class="ticker-wrap" id="ticker" aria-hidden="true"><div class="ticker"><div class="tk-track" id="tkTrack"></div></div></div>

  <section class="sec" id="works"><div class="wrap">
    <header class="sec-h rv"><p class="kicker" id="wKicker"></p><h2 id="wH2"></h2></header>
    <h3 class="grp rv" id="gClient"></h3>
    <div class="works" id="wClient"></div>
    <h3 class="grp rv" id="gShow"></h3>
    <div class="works" id="wShow"></div>
  </div></section>

  <section class="sec sec-alt" id="about"><div class="wrap about-in">
    <div class="about-copy rv"><p class="kicker" id="aKicker"></p><h2 id="aH2"></h2><div class="about-text" id="aText"></div></div>
    <aside class="about-card rv" style="--d:.08s"><img src="assets/logo-mark.png" width="217" height="128" alt="" loading="lazy"><h3 id="aName"></h3><p class="role" id="aRole"></p><div class="chips" id="aChips"></div></aside>
  </div></section>

  <section class="sec" id="services"><div class="wrap">
    <header class="sec-h rv"><p class="kicker" id="sKicker"></p><h2 id="sH2"></h2></header>
    <div class="svc" id="sList"></div>
  </div></section>

  <section class="sec sec-ink" id="process"><div class="wrap">
    <header class="sec-h rv"><p class="kicker" id="pKicker"></p><h2 id="pH2"></h2></header>
    <ol class="steps" id="pList"></ol>
  </div></section>

  <section class="sec sec-contact" id="contact"><div class="wrap contact-in">
    <header class="sec-h rv"><p class="kicker" id="cKicker"></p><h2 id="cH2"></h2><p class="lead" id="cLead"></p></header>
    <div class="contact-btns rv" id="cBtns"></div>
    <p class="contact-tel rv" id="cTel"></p>
  </div></section>
</main>

<footer class="ftr"><div class="wrap ftr-in"><b id="fBrand"></b><span id="fTag"></span><p id="fCredit"></p></div></footer>
<div id="waFab"></div>
<noscript><p style="padding:16px;text-align:center">JavaScript is required to view this page.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
