<body class="page-home">
<a class="skip" href="#main" id="skip"></a>
<header class="hdr" id="hdr"></header>

<main id="main">
  <!-- هيرو ثلاثي الأبعاد يتحرك مع التمرير: الصورة الثابتة تظهر أولاً ثم يحلّ المشهد محلّها -->
  <section class="hero3" id="top" aria-label="MOHAMMED">
    <div class="stick" id="stick">
      <div class="bg-fx" id="fx" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
      <picture class="h3-poster" id="h3Poster"><source media="(max-width: 760px)" srcset="assets/hero-poster-m.webp"><img src="assets/hero-poster.webp" width="1280" height="800" alt="" fetchpriority="high"></picture>
      <video class="h3-cv" id="stage" muted loop playsinline preload="none" disablepictureinpicture aria-hidden="true" tabindex="-1"></video>
      <div class="wrap h3-wrap"><div class="h3-copy" id="h3Copy"></div></div>
      <ol class="h3-dots" id="h3Dots" aria-hidden="true"></ol>
      <p class="h3-hint" id="h3Hint" aria-hidden="true"></p>
    </div>
  </section>

  <section class="pick" id="pick"><div class="wrap">
    <div class="pick-card rv">
      <div class="pick-l"><p class="kicker" id="kKicker"></p><h2 id="kH2"></h2><p class="pick-sub" id="kSub"></p><div class="pchips" id="kChips" role="group"></div></div>
      <div class="pick-r" id="kOut" aria-live="polite"></div>
    </div>
  </div></section>

  <section class="sec sec-works" id="featured">
    <div class="sec-fx" id="wfx" aria-hidden="true"><i class="mesh m1"></i><i class="mesh m2"></i></div>
    <div class="wrap">
      <header class="sec-h rv"><p class="kicker" id="fKicker"></p><h2 id="fH2"></h2></header>
      <div class="works" id="fList"></div>
      <div class="more-row rv"><a class="btn btn-lg" id="fMore" href="projects.html"></a></div>
    </div>
  </section>

  <section class="sec sec-ink demos" id="demos"><div class="wrap">
    <header class="sec-h rv"><p class="kicker" id="dKicker"></p><h2 id="dH2"></h2><p class="lead" id="dSub"></p></header>
    <div class="demo-grid" id="dGrid"></div>
  </div></section>

  <section class="sec" id="why"><div class="wrap">
    <header class="sec-h rv"><p class="kicker" id="yKicker"></p><h2 id="yH2"></h2></header>
    <div class="why-in">
      <div class="why-table rv" id="yTable" role="table"></div>
      <div class="why-side">
        <div class="why-card why-price rv" style="--d:.06s"><h3 id="yPriceT"></h3><p id="yPriceP"></p><a class="btn" id="yCta" href="#contact"></a></div>
        <div class="why-card why-ch rv" style="--d:.12s"><h3 id="yChT"></h3><p id="yChP"></p></div>
      </div>
    </div>
  </div></section>

  <section class="sec sec-alt" id="code"><div class="wrap code-in">
    <div class="code-copy rv"><p class="kicker" id="cdKicker"></p><h2 id="cdH2"></h2><p class="lead2" id="cdSub"></p><ul class="code-pts" id="cdPts"></ul><div class="chips chips-ink" id="cdChips"></div></div>
    <div class="codewin rv" style="--d:.08s" aria-hidden="true">
      <div class="cw-bar"><i></i><i></i><i></i><span>lazy-media.js</span></div>
      <pre class="cw-pre"><code id="cwCode"></code><b class="cw-caret"></b></pre>
    </div>
  </div></section>

  <section class="sec" id="services"><div class="wrap">
    <header class="sec-h rv"><p class="kicker" id="sKicker"></p><h2 id="sH2"></h2></header>
    <div class="svx rv" id="svx">
      <div class="svx-vis" id="svVis" aria-hidden="true"></div>
      <ol class="svx-list" id="sList"></ol>
    </div>
  </div></section>

  <section class="sec sec-ink" id="process"><div class="wrap">
    <header class="sec-h rv"><p class="kicker" id="pKicker"></p><h2 id="pH2"></h2></header>
    <ol class="steps steps3" id="pList"></ol>
    <p class="promise rv" id="pPromise"></p>
  </div></section>

  <section class="sec sec-alt" id="about"><div class="wrap about-in">
    <div class="about-copy rv"><p class="kicker" id="aKicker"></p><h2 id="aH2"></h2><div class="about-text" id="aText"></div></div>
    <aside class="about-card rv" style="--d:.08s"><img src="assets/logo-mark.png" width="217" height="128" alt="" loading="lazy"><h3 id="aName"></h3><p class="role" id="aRole"></p><div class="chips" id="aChips"></div></aside>
  </div></section>

  <section class="sec sec-contact" id="contact"><div class="wrap contact-in">
    <header class="sec-h rv"><p class="kicker" id="cKicker"></p><h2 id="cH2"></h2><p class="lead" id="cLead"></p></header>
    <div class="contact-btns rv" id="cBtns"></div>
    <p class="contact-tel rv" id="cTel"></p>
  </div></section>
</main>
